<!DOCTYPE html>
<html lang="en">

<head><script src="js/theme.js?v=blossom-night-1"></script>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | SATNIN's Database</title>

    <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/themes.css?v=satnin-24">

<link rel="stylesheet" href="css/footer.css?v=stable-filters-contact-13">
<link rel="icon" type="image/png" href="assets/cloud-horseshoe-logo.png?v=1">
<link rel="apple-touch-icon" href="assets/cloud-horseshoe-logo.png">
<link rel="stylesheet" href="css/header.css?v=satnin-24"><link rel="stylesheet" href="css/admin.css?v=admin-account-17"></head>

<body>

<header>

    <div class="header-brand"><a href="index.html" class="header-logo-image" aria-label="SATNIN's Database home"><img src="assets/cloud-horseshoe-logo.png" alt=""></a><div class="header-wordmark"><a href="index.html" class="logo">SATNIN's Database</a><a href="contact.html" class="logo-credit">for 2018 Horse Museum</a></div></div>

    <nav>

        <a href="database.html">
            Database
        </a>

        <a href="stable.html">
            My Stable
        </a>

        <a href="collection.html">
            My Collection
        </a>

        <a href="outfits.html">
            My Outfits
        </a>

    <span class="account-nav-actions"><a href="login.html" id="account-link" aria-current="page">Log in</a><a href="login.html#signup" id="signup-nav-link" hidden>Create account</a></span></nav>

</header>


<main>

    <h1>Account</h1>


    <div class="guest-account-forms"><section id="signup" data-guest-only hidden>

        <h2>Create account</h2>

        <input
            id="signup-username"
            type="text"
            placeholder="Username"
        >

        <input
            id="signup-email"
            type="email"
            placeholder="Email"
        >

        <input
            id="signup-password"
            type="password"
            placeholder="Password"
        >

        <button id="signup-button">
            Create account
        </button>

        <p id="signup-message"></p>

    </section>


    


    <section data-guest-only hidden>

        <h2>Log in</h2>

        <input
            id="login-email"
            type="email"
            placeholder="Email"
        >

        <input
            id="login-password"
            type="password"
            placeholder="Password"
        >

        <button id="login-button">
            Log in
        </button>

        <p id="login-message"></p>

    </section>


    </div><section id="logged-in-section" hidden>

        <h2>You are logged in</h2>

        <p id="logged-in-email"></p>

        <button id="logout-button">
            Log out
        </button>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/auth.js"></script><script src="js/delete-account.js?v=admin-account-17"></script>
<script src="js/auth-status.js?v=single-admin-tab-19"></script>

<script src="js/footer.js?v=satnin-24"></script></body>

</html>
