<!DOCTYPE html>
<html lang="en">

<head><script src="js/theme.js?v=blossom-night-1"></script>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | HM 2018</title>

    <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/themes.css?v=pastel-card-layout-1">

</head>

<body>

<header>

    <a href="index.html" class="logo">
        HM 2018
    </a>

    <nav>

        <a href="database.html">
            Database
        </a>

        <a href="stable.html">
            My Stable
        </a>

        <a href="collection.html">
            My Collection
        </a>

        <a href="outfits.html">
            My Outfits
        </a>

    </nav>

</header>


<main>

    <h1>Account</h1>


    <section id="signup" data-guest-only hidden>

        <h2>Create account</h2>

        <input
            id="signup-username"
            type="text"
            placeholder="Username"
        >

        <input
            id="signup-email"
            type="email"
            placeholder="Email"
        >

        <input
            id="signup-password"
            type="password"
            placeholder="Password"
        >

        <button id="signup-button">
            Create account
        </button>

        <p id="signup-message"></p>

    </section>


    <hr>


    <section data-guest-only hidden>

        <h2>Log in</h2>

        <input
            id="login-email"
            type="email"
            placeholder="Email"
        >

        <input
            id="login-password"
            type="password"
            placeholder="Password"
        >

        <button id="login-button">
            Log in
        </button>

        <p id="login-message"></p>

    </section>


    <section id="logged-in-section" hidden>

        <h2>You are logged in</h2>

        <p id="logged-in-email"></p>

        <button id="logout-button">
            Log out
        </button>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/auth.js"></script>

</body>

</html>
